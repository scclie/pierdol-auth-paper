name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch verified FastLogin compile-only JAR
        run: |
          python3 scripts/fetch-fastlogin-jar.py \
            --url 'https://api.spiget.org/v2/resources/134322/download?version=636152' \
            --sri-sha256 'sha256-sxVoz7e4gVCQ2ewDT5z315oue5HPZlAFy7/G7XCEDOs=' \
            --output "${RUNNER_TEMP}/FastLogin.jar"
      - name: Build and test plugin
        env:
          FASTLOGIN_JAR: ${{ runner.temp }}/FastLogin.jar
        run: ./gradlew --no-daemon clean check
